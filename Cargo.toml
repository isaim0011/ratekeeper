[workspace]
members  = ["ratekeeper", "xtask"]
resolver = "2"

[workspace.package]
version     = "0.4.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/isaim0011/ratekeeper"
authors     = ["isaim0011"]

[workspace.dependencies]
# Async runtime
tokio        = { version = "1",    features = ["time", "sync", "rt", "macros"] }
async-trait  = "0.1"
futures-core = "0.3"

# In-memory
moka    = { version = "0.12", features = ["future"] }
dashmap = { version = "6" }

# Redis
redis          = { version = "0.27", features = ["tokio-comp", "script", "connection-manager"] }
deadpool-redis = { version = "0.18" }

# Tower / HTTP
tower         = { version = "0.5", features = ["util"] }
tower-service = { version = "0.3" }
http          = { version = "1" }
axum-core     = { version = "0.5" }
pin-project-lite = { version = "0.2" }

# Observability
prometheus = { version = "0.13" }
tracing    = "0.1"

# Utils
serde       = { version = "1", features = ["derive"] }
thiserror   = "2"
parking_lot = "0.12"

# Dev
tokio-test         = "0.4"
axum               = "0.8"
criterion          = { version = "0.5", features = ["async_tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
